name: Publicar app (Firebase)

# Se ejecuta cuando hay cambios en estas ramas, o manualmente con el botón
# "Run workflow" desde la pestaña Actions de GitHub (se puede desde el celular).
on:
  push:
    branches:
      - main
      - claude/restaurant-rating-app-kARG5
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Crear archivo .env con las credenciales (desde los Secrets)
        run: |
          cat > .env <<EOF
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          EOF

      - name: Construir la app
        run: npm run build

      - name: Guardar la llave de servicio de Firebase
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-key.json"

      - name: Publicar en Firebase (hosting + reglas)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-key.json
        run: |
          npx --yes firebase-tools@13 deploy \
            --only hosting,firestore,storage \
            --project "${{ secrets.VITE_FIREBASE_PROJECT_ID }}" \
            --non-interactive
